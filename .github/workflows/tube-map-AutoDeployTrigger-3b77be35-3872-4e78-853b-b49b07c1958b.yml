name: Trigger auto deployment for tube-map

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/tube-map-AutoDeployTrigger-3b77be35-3872-4e78-853b-b49b07c1958b.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TUBEMAP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TUBEMAP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TUBEMAP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: tflmaptubeacr.azurecr.io
          registryUsername: ${{ secrets.TUBEMAP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.TUBEMAP_REGISTRY_PASSWORD }}
          containerAppName: tube-map
          resourceGroup: vibeconf-rg
          imageToBuild: tflmaptubeacr.azurecr.io/tube-map:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


